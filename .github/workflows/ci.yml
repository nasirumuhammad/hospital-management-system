name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthcare_app
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: healthcare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U healthcare_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://healthcare_app:change_me@localhost:5432/healthcare_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
